<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Map</title>

  <!-- Leaflet: the free map library. Loaded from a public CDN, pinned to one version. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Family Map <span class="version">v0.6</span></h1>
    <p class="tagline">See where your ancestors were born and died. Your file stays on your computer.</p>
  </header>

  <section class="controls">
    <label class="file-button">
      Choose a GEDCOM file (.ged)
      <input type="file" id="fileInput" accept=".ged,.gedcom,text/plain">
    </label>
    <button id="sampleButton" type="button">Or try the sample family</button>
    <p id="status">No file loaded yet.</p>
  </section>

  <section class="timeline">
    <button id="playButton" type="button">Play</button>
    <input type="range" id="yearSlider" min="1800" max="2000" value="1800" step="1" aria-label="Year">
    <span id="yearLabel">All years</span>
    <label>Speed
      <select id="speedSelect">
        <option value="2">Slow</option>
        <option value="5" selected>Normal</option>
        <option value="15">Fast</option>
        <option value="40">Very fast</option>
      </select>
    </label>
    <label><input type="checkbox" id="allYears" checked> All years</label>
  </section>

  <main>
    <div id="map"></div>
    <aside id="peoplePanel">
      <h2>People</h2>
      <ul id="peopleList"></ul>
    </aside>
  </main>

  <footer>
    Place lookups by <a href="https://nominatim.openstreetmap.org/">OpenStreetMap Nominatim</a>.
    Only place names are sent, never names of people.
  </footer>

  <script src="gedcom.js"></script>
  <script src="places.js"></script>
  <script src="geocode.js"></script>
  <script src="timeline.js"></script>
  <script src="app.js"></script>
</body>
</html>
