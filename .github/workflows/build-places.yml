# Builds the place database (data/places/*.json) from GeoNames, on GitHub's computers.
# Runs when tools/build_places.py changes, or by hand from the repository's Actions tab.
name: Build place database

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/build_places.py"
      - ".github/workflows/build-places.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build place files
        run: python tools/build_places.py
      - name: Save the files back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then
            echo "No changes to the place files."
          else
            git commit -m "Update place database from GeoNames"
            git pull --rebase   # in case someone pushed while this was running
            git push
          fi
